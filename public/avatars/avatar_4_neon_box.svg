<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#24141e" />
      <stop offset="60%" stop-color="#120c11" />
      <stop offset="100%" stop-color="#070608" />
    </radialGradient>

    <!-- Neon Ribbon Gradient -->
    <linearGradient id="neonRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7eb3" />
      <stop offset="50%" stop-color="#e26197" />
      <stop offset="100%" stop-color="#c4457b" />
    </linearGradient>

    <!-- Box Face Gradients -->
    <linearGradient id="boxTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#32202c" />
      <stop offset="100%" stop-color="#1f141b" />
    </linearGradient>
    <linearGradient id="boxLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f141b" />
      <stop offset="100%" stop-color="#120a10" />
    </linearGradient>
    <linearGradient id="boxRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#271822" />
      <stop offset="100%" stop-color="#180e15" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="16" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep OLED Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGlow)" />

  <!-- Ambient Glow Behind Box -->
  <circle cx="256" cy="270" r="140" fill="#c4457b" opacity="0.25" filter="blur(40px)" />

  <!-- 3D Isometric Present -->
  <g transform="translate(0, 30)">
    <!-- Box Shadow -->
    <ellipse cx="256" cy="390" rx="130" ry="35" fill="#000000" opacity="0.6" filter="blur(15px)" />

    <!-- Left Face -->
    <polygon points="256,230 130,175 130,325 256,380" fill="url(#boxLeft)" stroke="#e26197" stroke-width="1.5" stroke-opacity="0.3" />

    <!-- Right Face -->
    <polygon points="256,230 382,175 382,325 256,380" fill="url(#boxRight)" stroke="#e26197" stroke-width="1.5" stroke-opacity="0.3" />

    <!-- Top Face -->
    <polygon points="256,120 382,175 256,230 130,175" fill="url(#boxTop)" stroke="#e26197" stroke-width="1.5" stroke-opacity="0.5" />

    <!-- Left Ribbon Vertical -->
    <polygon points="193,203 193,353 213,361 213,212" fill="url(#neonRibbon)" filter="url(#neonGlow)" />

    <!-- Right Ribbon Vertical -->
    <polygon points="299,212 299,361 319,353 319,203" fill="url(#neonRibbon)" filter="url(#neonGlow)" />

    <!-- Top Ribbon 1 -->
    <polygon points="193,148 213,156 319,203 299,194" fill="url(#neonRibbon)" filter="url(#neonGlow)" />

    <!-- Top Ribbon 2 -->
    <polygon points="319,148 299,156 193,203 213,194" fill="url(#neonRibbon)" filter="url(#neonGlow)" />

    <!-- 3D Luxury Bow -->
    <!-- Left Loop -->
    <path d="M 256,120 C 220,70 170,90 195,125 C 220,150 250,125 256,120 Z" fill="url(#neonRibbon)" filter="url(#neonGlow)" />
    <!-- Right Loop -->
    <path d="M 256,120 C 292,70 342,90 317,125 C 292,150 262,125 256,120 Z" fill="url(#neonRibbon)" filter="url(#neonGlow)" />
    <!-- Bow Knot -->
    <circle cx="256" cy="120" r="14" fill="#ff9cc5" filter="url(#neonGlow)" />
  </g>

  <!-- Star Sparkles -->
  <g fill="#ffffff" filter="url(#neonGlow)">
    <path d="M 120,110 Q 120,125 105,125 Q 120,125 120,140 Q 120,125 135,125 Q 120,125 120,110 Z" fill="#ff7eb3" opacity="0.9" />
    <path d="M 390,130 Q 390,140 380,140 Q 390,140 390,150 Q 390,140 400,140 Q 390,140 390,130 Z" fill="#ffd1e3" opacity="0.9" />
    <path d="M 370,350 Q 370,360 360,360 Q 370,360 370,370 Q 370,360 380,360 Q 370,360 370,350 Z" fill="#ff7eb3" opacity="0.8" />
  </g>
</svg>
